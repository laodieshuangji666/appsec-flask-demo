<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}简易登录系统{% endblock %}</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 55%, #ecfeff 100%);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .card {
      width: min(420px, 100%);
      padding: 36px 32px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(30, 64, 175, 0.14);
    }

    .logo {
      width: 52px;
      height: 52px;
      margin-bottom: 20px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
    }

    h1 { margin: 0 0 8px; font-size: 26px; }
    .subtitle { margin: 0 0 24px; color: var(--muted); font-size: 14px; }

    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.14);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--primary-dark); }
    button.secondary { background: #f3f4f6; color: var(--text); }
    button.secondary:hover { background: #e5e7eb; }

    .switch {
      margin: 20px 0 0;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    a { color: var(--primary); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }

    .messages { margin-bottom: 20px; }
    .message {
      margin-bottom: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
    }
    .message.error { background: #fef2f2; color: #b91c1c; }
    .message.success { background: #f0fdf4; color: #15803d; }

    .profile {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #f9fafb;
    }

    .avatar {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #dbeafe;
      color: var(--primary-dark);
      font-size: 20px;
      font-weight: 700;
    }

    .welcome { margin: 0 0 4px; font-size: 18px; font-weight: 700; }
    .hint { margin: 0; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="messages">
          {% for category, message in messages %}
            <div class="message {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
